name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      RESEND_API_KEY: re_ci_placeholder
      ADMIN_EMAIL: ci@example.invalid
      HASH_SALT: ci-only-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: One-time Astro 7 runtime migration
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          import_line = "import { env } from 'cloudflare:workers';"
          changed = []
          for path in Path('src/pages').rglob('*'):
              if not path.is_file() or path.suffix not in {'.astro', '.ts'}:
                  continue
              original = path.read_text()
              text = original
              legacy = ('Astro.locals.runtime.env' in text or 'locals.runtime.env' in text)
              if not legacy:
                  continue

              text = re.sub(r'^\s*const env = (?:Astro\.locals|locals)\.runtime\.env;\s*\n', '', text, flags=re.MULTILINE)
              text = text.replace('Astro.locals.runtime.env', 'env')
              text = text.replace('locals.runtime.env', 'env')

              if import_line not in text:
                  if path.suffix == '.astro':
                      if not text.startswith('---\n'):
                          raise RuntimeError(f'Unexpected Astro frontmatter in {path}')
                      text = text.replace('---\n', f'---\n{import_line}\n', 1)
                  else:
                      text = f'{import_line}\n{text}'

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          leftovers = []
          for path in Path('src/pages').rglob('*'):
              if path.is_file() and path.suffix in {'.astro', '.ts'}:
                  text = path.read_text()
                  if '.runtime.env' in text:
                      leftovers.append(str(path))
          if leftovers:
              raise RuntimeError(f'Legacy runtime env access remains in: {leftovers}')
          print('Migrated:', ', '.join(changed) if changed else 'already clean')
          PY

          if ! git diff --quiet -- src/pages; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages
            git commit -m "Migrate Cloudflare env access for Astro 7"
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify removed runtime API stays gone
        run: |
          if grep -R -n -E 'Astro\.locals\.runtime|locals\.runtime\.env' src/pages; then
            echo 'Legacy Astro Cloudflare runtime access found.'
            exit 1
          fi
      - name: Validate D1 schema and seeds
        run: |
          python3 - <<'PY'
          import pathlib
          import sqlite3

          db = sqlite3.connect(':memory:')
          db.executescript(pathlib.Path('db/schema.sql').read_text())
          db.executescript(pathlib.Path('db/seed.sql').read_text())
          db.executescript(pathlib.Path('db/seed_google_top100_a.sql').read_text())
          db.executescript(pathlib.Path('db/seed_google_top100_b.sql').read_text())

          listings = db.execute('SELECT COUNT(*) FROM homestays').fetchone()[0]
          google_listings = db.execute('SELECT COUNT(*) FROM homestays WHERE google_rating IS NOT NULL').fetchone()[0]
          reviews = db.execute('SELECT COUNT(*) FROM reviews').fetchone()[0]
          assert listings >= 118, f'Expected at least 118 listings, found {listings}'
          assert google_listings == 100, f'Expected 100 Google-reference listings, found {google_listings}'
          assert reviews == 0, f'Seed must contain zero HomestayReview reviews, found {reviews}'
          print(f'Validated {listings} listings, {google_listings} Google-reference listings and {reviews} seeded reviews')
          PY
      - name: Build Cloudflare Worker
        run: npm run build
      - name: Prepare local D1 for runtime smoke test
        run: |
          npx wrangler d1 execute homestay-review-db --local --file=./db/schema.sql
          npx wrangler d1 execute homestay-review-db --local --file=./db/seed_google_top100_a.sql
          npx wrangler d1 execute homestay-review-db --local --file=./db/seed_google_top100_b.sql
      - name: Smoke test rendered homepage in workerd
        run: |
          set -euo pipefail
          npx astro preview --host 127.0.0.1 --port 8787 > /tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 30); do
            if curl -sS -D /tmp/home.headers -o /tmp/home.body http://127.0.0.1:8787/; then
              READY=1
              break
            fi
            sleep 1
          done

          echo '--- preview log ---'
          cat /tmp/astro-preview.log || true
          echo '--- response headers ---'
          cat /tmp/home.headers || true
          echo '--- response body ---'
          head -c 1200 /tmp/home.body || true
          echo

          test "$READY" = "1"
          grep -Eq '^HTTP/.* 200' /tmp/home.headers
          grep -Eiq '^content-type:.*text/html' /tmp/home.headers
          grep -q 'homestay' /tmp/home.body
